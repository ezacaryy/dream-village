<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Village Zoo Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f4;
        }
        #chat-container {
            border: 1px solid #ccc;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            background-color: white;
            margin-bottom: 10px;
        }
        .message {
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 5px;
        }
        .user {
            background-color: #e3f2fd;
            text-align: right;
        }
        .bot {
            background-color: #f5f5f5;
        }
        #input-container {
            display: flex;
        }
        #message-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px 0 0 5px;
        }
        #send-button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 0 5px 5px 0;
            cursor: pointer;
        }
        #send-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Dream Village Zoo Chatbot</h1>
    <p>Ask me anything about our zoo! I can help with animals, tickets, hours, and more.</p>

    <div id="chat-container"></div>

    <div id="input-container">
        <input type="text" id="message-input" placeholder="Type your question here...">
        <button id="send-button">Send</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');

        const systemPrompt = `
You are ZooBot, the official assistant for Dream Village Zoo.

You ONLY answer questions related to:
- Animals and species
- Zoo rules and safety
- Tickets, prices, opening hours
- Attractions and shows
- Conservation and education

If a question is not zoo-related, politely refuse and redirect to zoo topics.
`;

        let conversation = [
            { role: "system", content: systemPrompt }
        ];

        function addMessage(content, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            messageDiv.textContent = content;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const userMessage = messageInput.value.trim();
            if (!userMessage) return;

            addMessage(userMessage, 'user');
            messageInput.value = '';

            conversation.push({ role: "user", content: userMessage });

            try {
                const response = await fetch("http://localhost:11434/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "llama3",
                        messages: conversation,
                        stream: false
                    })
                });

                if (!response.ok) {
                    throw new Error("Ollama not running");
                }

                const data = await response.json();
                const botMessage = data.message.content;

                addMessage(botMessage, 'bot');
                conversation.push({ role: "assistant", content: botMessage });

            } catch (error) {
                addMessage(
                    "ZooBot is offline. Please make sure Ollama is running on this computer.",
                    "bot"
                );
                console.error(error);
            }
        }

        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        addMessage(
            "Hello! I'm ZooBot 🦁 Ask me anything about Dream Village Zoo.",
            "bot"
        );
    </script>
</body>
</html>
